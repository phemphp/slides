# The presentation: the prod image, with the SQLite database in a volume.
#   docker compose -f compose.prod.yaml up --build
name: slides-live

services:
  app:
    build: { context: ., target: prod }
    ports: ["${PORT:-8080}:8080"]
    volumes:
      - data:/app/var/data
    restart: unless-stopped

volumes:
  data:
