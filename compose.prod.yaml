# The live presentation: the prod image, with the SQLite database in a volume.
#   SPEAKER_KEY=... PUBLIC_URL=http://<your LAN IP>:8080 docker compose -f compose.prod.yaml up --build
name: slides-live

services:
  app:
    build: { context: ., target: prod }
    ports: ["${PORT:-8080}:8080"]
    environment:
      SPEAKER_KEY: ${SPEAKER_KEY:?Set SPEAKER_KEY: the key of the speaker URL}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - data:/app/var/data
    restart: unless-stopped

volumes:
  data:
