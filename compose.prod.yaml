# The live presentation: the prod image, with the SQLite database in a volume.
#   On the LAN:  SPEAKER_KEY=... PUBLIC_URL=http://<your LAN IP>:8080 docker compose -f compose.prod.yaml up --build
#   With HTTPS:  SPEAKER_KEY=... TUNNEL_TOKEN=... PUBLIC_URL=https://<the tunnel hostname> \
#                docker compose -f compose.prod.yaml --profile tunnel up --build
name: slides-live

services:
  app:
    build: { context: ., target: prod }
    ports: ["${PORT:-8080}:8080"]
    environment:
      SPEAKER_KEY: "${SPEAKER_KEY:?Set SPEAKER_KEY, the key of the speaker URL}"
      PUBLIC_URL: ${PUBLIC_URL:-}
      # The tunnel ends TLS: trust its X-Forwarded-Proto, so the app makes https URLs.
      SYMFONY_TRUSTED_PROXIES: private_ranges
      SYMFONY_TRUSTED_HEADERS: x-forwarded-for,x-forwarded-proto
    volumes:
      - data:/app/var/data
    restart: unless-stopped

  # HTTPS for the phones: a named Cloudflare Tunnel to http://app:8080.
  # A quick tunnel (trycloudflare.com) does not work: it does not support SSE, so no Mercure.
  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [app]
    restart: unless-stopped
    profiles: [tunnel]

volumes:
  data:
