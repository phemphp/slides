# The dev server: the project is mounted, phemc and Tailwind build again on each change.
# The presentation uses it too: the deck shows the debug toolbar of Symfony.
name: slides-dev

services:
  app:
    build: { context: ., target: dev }
    # Docker publishes the port to this machine only: a phone opens the slides through a tunnel
    # (make tunnel), not through the network. The Caddyfile needs this for the profiler.
    ports: ["127.0.0.1:8080:8080"]
    # The public URL of the slides, for the QR code of the deck (make up PHONE_URL=https://...).
    environment:
      PHONE_URL: ${PHONE_URL:-}
      # The tunnel ends TLS: trust its X-Forwarded-Proto, so the app makes https URLs (the debug
      # toolbar loads with them). Only this machine can connect, so the header is from the tunnel.
      SYMFONY_TRUSTED_PROXIES: private_ranges
      SYMFONY_TRUSTED_HEADERS: x-forwarded-for,x-forwarded-proto
    volumes:
      - .:/app
