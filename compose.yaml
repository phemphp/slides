# The dev server: the project is mounted, phemc and Tailwind build again on each change.
# The presentation uses compose.prod.yaml.
name: slides-dev

services:
  app:
    build: { context: ., target: dev }
    ports: ["8080:8080"]
    # The address of the host in the current network, for the QR code of the deck. The Makefile
    # sets it.
    environment:
      HOST_IP: ${HOST_IP:-}
    volumes:
      - .:/app
